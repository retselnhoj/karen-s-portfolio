<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The placeholders in percent signs and the two "seo" comments are filled in at build
         time from src/data/site.js (see scripts/seo.mjs) — edit them there, not here. -->
    <title>Crescela Nuvali Lots for Sale | Karen Besueno – The Property Aligner</title>
    <meta name="description" content="Residential lots for sale in Crescela Nuvali by Avida, Santa Rosa, Laguna. View the site plan, elevation range and inquire about any block and lot with Karen Besueno." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#c9798a" />
    <meta name="geo.region" content="PH-LAG" />

    <!-- Link preview (Facebook / Messenger / Viber) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Crescela Nuvali Lots for Sale | Karen Besueno – The Property Aligner" />

    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preload" as="image" href="%HERO_IMAGE%" imagesrcset="%HERO_SRCSET%" imagesizes="100vw" fetchpriority="high" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond.woff2" crossorigin />

    <!--seo:jsonld-->
  </head>
  <body>
    <!-- Hidden form so Netlify detects the lead form at deploy time -->

</html>
